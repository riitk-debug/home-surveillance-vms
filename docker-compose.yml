services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9997:9997"   # Control API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

volumes:
  mongo-data:
